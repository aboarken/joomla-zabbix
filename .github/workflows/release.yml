# Builds the Joomla installation package (com_zabbix.zip), the Joomla update server file
# (updates.xml) and the Joomla changelog (changelog.xml), and attaches them to GitHub releases.
# Joomla sites find updates through releases/latest/download/updates.xml (see <updateservers> in
# zabbix.xml) and the changelog through releases/latest/download/changelog.xml.
#
# - Pull requests and pushes to main: build and check the package, keep it as a workflow artifact.
# - Release published in the GitHub UI (tag v<version>): build from that tag, check that the tag
#   matches the manifest version, and attach com_zabbix.zip and updates.xml to the release.
# - Run manually (Actions > Release package > Run workflow): create release v<manifest version>
#   from main with docs/release-notes/<version>.md as notes, and attach both files.
#
# Security: the "package" job (tests, build) only reads the repository. Only the "publish" job
# can write, and only for a published release or a manual run on main; it runs no code from
# the repository, it only attaches the files the package job built.
name: Release package

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs with write access.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Read version from manifest
        id: version
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' zabbix.xml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Check release tag matches the manifest
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match manifest version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - name: Lint PHP
        run: |
          php -v | head -n1
          find administrator site script.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install test tools (development only; not part of the package)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run automated tests (fake Zabbix API; database classes on SQLite)
        run: vendor/bin/phpunit

      # The runner's own MySQL and PostgreSQL: the install and uninstall scripts are run exactly
      # as shipped, and the database classes against the tables they make.
      - name: Run database tests on MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS zbxtest'
          ZABBIX_TEST_MYSQL='host=127.0.0.1;user=root;password=root;database=zbxtest' vendor/bin/phpunit --testsuite integration

      - name: Run database tests on PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres psql -c 'CREATE DATABASE zbxtest'
          ZABBIX_TEST_PGSQL='host=127.0.0.1;port=5432;user=postgres;password=postgres;database=zbxtest' vendor/bin/phpunit --testsuite integration

      - name: Build package
        run: |
          build/build-package.sh
          cp "dist/com_zabbix-${{ steps.version.outputs.version }}.zip" dist/com_zabbix.zip

      - name: Check package structure
        run: python3 -I build/verify-package.py dist/com_zabbix.zip "${{ steps.version.outputs.version }}"

      - name: Write Joomla update file
        run: |
          python3 -I build/make-update-xml.py dist/com_zabbix.zip "${{ steps.version.outputs.version }}" dist/updates.xml
          python3 -I -c "import xml.etree.ElementTree as E; E.parse('dist/updates.xml')"

      - name: Write Joomla changelog file
        run: |
          python3 -I build/make-changelog-xml.py CHANGELOG.md dist/changelog.xml
          python3 -I -c "import xml.etree.ElementTree as E, sys; v = E.parse('dist/changelog.xml').getroot()[0].findtext('version'); sys.exit(0 if v == '${{ steps.version.outputs.version }}' else 'changelog.xml starts with ' + str(v) + ', expected the manifest version')"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f "docs/release-notes/$VERSION.md" ]; then
            cp "docs/release-notes/$VERSION.md" dist/release-notes.md
          else
            # This version's section of the changelog.
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > dist/release-notes.md
          fi
          test -s dist/release-notes.md

      - name: Keep package as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: com_zabbix-${{ steps.version.outputs.version }}
          path: |
            dist/com_zabbix.zip
            dist/updates.xml
            dist/changelog.xml
            dist/release-notes.md
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Releases are made from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main to make a release (was ${GITHUB_REF})."
          exit 1

      - name: Get the package built by the package job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: com_zabbix-${{ needs.package.outputs.version }}
          path: dist

      - name: Attach package to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/com_zabbix.zip dist/updates.xml dist/changelog.xml --clobber --repo "$GITHUB_REPOSITORY"

      - name: Create release with package
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v$VERSION"
          notes=dist/release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag exists; replacing its package and update file."
            gh release upload "$tag" dist/com_zabbix.zip dist/updates.xml dist/changelog.xml --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/com_zabbix.zip dist/updates.xml dist/changelog.xml \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "com_zabbix $VERSION" \
              --notes-file "$notes"
          fi
