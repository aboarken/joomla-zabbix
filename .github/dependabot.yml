# Dependabot opens a pull request when an action the workflows use (pinned to a commit) or a
# development tool in composer.json has a new version. Nothing is merged without review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # The release workflow runs on ubuntu-24.04 (PHP 8.3); PHPUnit 13 needs PHP 8.4. Major PHPUnit
    # updates are made by hand, together with the tests.
    ignore:
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        patterns: ["*"]
