COM_ZABBIX_SETTINGS_AUTO_APPROVE_DESC="When a user is matched to a Zabbix user automatically (on their first visit, or with Rematch): <strong>Approve automatically:</strong> the match works at once. <strong>Wait for administrator approval:</strong> the user sees a waiting page until you confirm the match in User Mappings (select it, then Confirm). Choose this where users can change their Joomla username or e-mail freely, since someone could enter a colleague's before their first visit. A waiting user whose Joomla e-mail changes is suspended. Users waiting now are approved on their next visit once this is set to Approve automatically. Mappings you make or confirm yourself are never held."
